<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Edit Show</title>
</head>

<body>
    <div class="container">
        <h1 class="mb-4 mt-5">Edit Show {{ show.id }}</h1>
        <form action="/shows/{{ show.id }}/update/" method="POST" class="p-3 border rounded shadow-sm bg-light">
            {% csrf_token %}
            <div class="row mb-3">
                <div class="col-md-12">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" id="title" name="title" class="form-control" value="{{ show.title }}" required>
                </div>

            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="release_date" class="form-label">Release Date</label>
                    <input type="date" id="release_date" name="release_date" class="form-control"
                        value="{{ show.release_date|date:'Y-m-d' }}" required>
                </div>
                <div class="col-md-6">
                    <label for="network" class="form-label">Network</label>
                    <input type="text" id="network" name="network" class="form-control" value="{{ show.network }}"
                        required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-12">
                    <label for="description" class="form-label">Description</label>
                    <textarea id="description" name="description" class="form-control">{{ show.description }}</textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Update</button>
        </form>
    </div>
</body>

</html>
