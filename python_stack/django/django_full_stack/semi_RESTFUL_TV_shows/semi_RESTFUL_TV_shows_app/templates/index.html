<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Shows</title>
</head>

<body>
    <div class="container">
        <div class="row m-5">
            <h1>All Shows</h1>
            <div class="col-md-12">
                {% if shows.all %}
                <table class="table table-striped mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Network</th>
                            <th>Release Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for show in shows.all %}
                        <tr>
                            <td>{{ show.id }}</td>
                            <td>{{ show.title }}</td>
                            <td>{{ show.network }}</td>
                            <td>{{ show.release_date }}</td>
                            <td><a href="/shows/{{ show.id }}/" class="btn btn-sm btn-outline-primary">Show</a> | <a href="/shows/{{ show.id }}/edit/" class="btn btn-sm btn-outline-secondary">Edit</a> | <a href="/shows/{{ show.id }}/destroy/" class="btn btn-sm btn-outline-danger">Delete</a></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                {% else %}
                <p>No shows available.</p>
                {% endif %}
            </div>
        </div>
        <a href="/shows/new/" class="btn btn-primary">Add New Show</a>
    </div>
</body>

</html>
