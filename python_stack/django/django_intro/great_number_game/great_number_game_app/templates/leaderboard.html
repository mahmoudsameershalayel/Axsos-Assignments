{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h1>Leaderboard</h1>
    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Name</th>
                <th>Attempts</th>
            </tr>
        </thead>
        <tbody>
            {% for winner in winners %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ winner.name }}</td>
                <td>{{ winner.attempts }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="3">No winners yet — be the first!</td></tr>
            {% endfor %}
        </tbody>
    </table>
    <a class="btn-green" href="/">Play Again</a>
</body>
</html>
