<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ninja Gold Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .gold-display {
            font-size: 1.2rem;
            margin-bottom: 24px;
        }
        .gold-display input {
            font-size: 1.1rem;
            width: 80px;
            text-align: center;
            padding: 4px;
        }
        .locations {
            display: flex;
            gap: 16px;
            margin-bottom: 30px;
        }
        .location-card {
            border: 1px solid #ccc;
            padding: 20px;
            flex: 1;
            text-align: center;
        }
        .location-card h3 {
            margin: 0 0 8px;
        }
        .location-card p {
            margin: 0 0 16px;
            font-size: 0.9rem;
            color: #555;
        }
        .location-card button {
            padding: 6px 14px;
            cursor: pointer;
        }
        .activities-section h3 {
            margin-bottom: 8px;
        }
        .activity-log {
            border: 1px solid #999;
            padding: 12px;
            min-height: 80px;
        }
        .activity-log p {
            margin: 4px 0;
        }
        .positive { color: green; }
        .negative { color: red; }
    </style>
</head>
<body>
    <div class="gold-display">
        Your Gold: <input type="text" value="{{ gold }}" readonly>
    </div>

    <div class="locations">
        <div class="location-card">
            <h3>Farm</h3>
            <p>(earns 10-20 gold)</p>
            <form action="/process_money" method="post">
                {% csrf_token %}
                <input type="hidden" name="location" value="farm">
                <button type="submit">Find Gold!</button>
            </form>
        </div>

        <div class="location-card">
            <h3>Cave</h3>
            <p>(earns 10-20 gold)</p>
            <form action="/process_money" method="post">
                {% csrf_token %}
                <input type="hidden" name="location" value="cave">
                <button type="submit">Find Gold!</button>
            </form>
        </div>

        <div class="location-card">
            <h3>House</h3>
            <p>(earns 10-20 gold)</p>
            <form action="/process_money" method="post">
                {% csrf_token %}
                <input type="hidden" name="location" value="house">
                <button type="submit">Find Gold!</button>
            </form>
        </div>

        <div class="location-card">
            <h3>Quest</h3>
            <p>(earns/takes 0 - 50 gold)</p>
            <form action="/process_money" method="post">
                {% csrf_token %}
                <input type="hidden" name="location" value="quest">
                <button type="submit">Find Gold!</button>
            </form>
        </div>
    </div>

    <div class="activities-section">
        <h3>Activities:</h3>
        <div class="activity-log">
            {% for activity in activities %}
                <p class="{% if activity.positive %}positive{% else %}negative{% endif %}">
                    {{ activity.message }}
                </p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
