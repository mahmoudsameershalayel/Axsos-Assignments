<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <form action="/survey" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="user_name" class="form-label">Your Name:</label>
                <input type="text" name="user_name" class="form-control" id="user_name">
            </div>
            <div class="mb-3">
                <label for="location" class="form-label">Dojo Location:</label>
                <select id="location" name="location" class="form-select">
                    <option>Gaza</option>
                    <option>Rafah</option>
                    <option>Nablus</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="favorite_language" class="form-label">Favorite Language:</label>
                <select id="favorite_language" name="language" class="form-select">
                    <option>java</option>
                    <option>c#</option>
                    <option>c++</option>
                    <option>c</option>
                    <option>python</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Experience Level:</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="experience" id="beginner" value="Beginner">
                    <label class="form-check-label" for="beginner">Beginner</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="experience" id="intermediate" value="Intermediate">
                    <label class="form-check-label" for="intermediate">Intermediate</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="experience" id="advanced" value="Advanced">
                    <label class="form-check-label" for="advanced">Advanced</label>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Interests:</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="interests" id="web" value="Web Development">
                    <label class="form-check-label" for="web">Web Development</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="interests" id="mobile" value="Mobile Development">
                    <label class="form-check-label" for="mobile">Mobile Development</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="interests" id="ai" value="AI / Machine Learning">
                    <label class="form-check-label" for="ai">AI / Machine Learning</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="interests" id="devops" value="DevOps">
                    <label class="form-check-label" for="devops">DevOps</label>
                </div>
            </div>
            <div class="mb-3">
                <label for="floatingTextarea" class="form-label">Comment (optional):</label>
                <textarea class="form-control" name="comment" id="floatingTextarea"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
